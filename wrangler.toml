# Cloudflare Worker für chessanalyzer.cxrgi.workers.dev
# Veröffentlichen: node tools/deploy-cloudflare.mjs   (CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID setzen)
name = "chessanalyzer"
main = "cloudflare/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Die Browser-Dateien liegen im KV-Speicher (hochgeladen von tools/deploy-cloudflare.mjs, das auch
# cloudflare/site-manifest.json erzeugt). Der Worker liefert sie aus – nur angemeldet, außer Bildern, Engine & Co.
[[kv_namespaces]]
binding = "SITE"
id = "2af8dfa8d23d458399ea1c91bb633c40"

[[d1_databases]]
binding = "DB"
database_name = "chessanalyzer"
database_id = "9002e855-d5a3-4d11-9604-9d21e21f4bc4"

[vars]
# "1" zeigt während eines Umzugs nur eine Hinweisseite
MAINTENANCE = "0"
