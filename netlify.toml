[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Sicherheits-Header für alle Seiten und Dateien.
# Bewusst ohne script-src/style-src: Die Seite nutzt Inline-Styles und Inline-Skripte (Anmeldeseite, Verwaltung).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; form-action 'self'"
    # Macht die Seite „cross-origin isolated“: Erst dann darf die Engine mehrere Prozessorkerne nutzen.
    # „credentialless“ lässt fremde Bilder (z. B. Profilbilder von chess.com) weiter laden; Browser ohne
    # Unterstützung ignorieren die Zeile einfach und nutzen die Einzelkern-Engine.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# Der Service Worker muss immer frisch geprüft werden, sonst kommen Updates nicht an.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# Lange cachen, was sich selten ändert – das spart Anfragen (und damit Netlify-Kontingent).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
